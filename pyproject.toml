[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-pipeline"
version = "0.1.0"
description = "Daily pipeline: hourly air-quality readings and weather for Polish cities into a tested PostgreSQL warehouse"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dbt = ["dbt-core==1.11.8", "dbt-postgres==1.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "dags"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["airquality", "fixture_api", "load_sample", "alerts", "run_day", "air_quality_daily"]
