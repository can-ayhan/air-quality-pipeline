version: 2

sources:
  - name: raw
    description: Tables written by the ingest command, one per API endpoint. Every load is an upsert on the key.
    schema: raw
    tables:
      - name: gios_station
        description: Measuring stations of the covered cities (GIOS station/findAll).
        columns:
          - name: station_id
            data_tests: [not_null, unique]

      - name: gios_sensor
        description: One row per station and pollutant measured there (GIOS station/sensors).
        columns:
          - name: sensor_id
            data_tests: [not_null, unique]

      - name: gios_measurement
        description: Hourly results per sensor (GIOS archivalData/getDataBySensor). Timestamps are CET all year.
        columns:
          - name: sensor_id
            data_tests: [not_null]
          - name: measured_at_cet
            data_tests: [not_null]

      - name: openmeteo_hourly
        description: Hourly weather for one point per city (Open-Meteo). Timestamps are UTC.
        columns:
          - name: city
            data_tests: [not_null]
          - name: time_utc
            data_tests: [not_null]
